<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Testilomake</title>

</head>

<body>
<style>
  .dyn-block {
    display: grid;
    gap: 0.75rem;
    padding: 1rem;
    margin-bottom: 1rem;
    max-width: 500px;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .field {
    display: grid;
    gap: 0.25rem;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
  }

  .actions {
    display: flex;
    gap: 0.5rem;
  }

  }
</style>

<div class="dyn-block" id="block1">

  <label class="field">
    <span>Kuvaus</span>
    <textarea maxlength="500" class="text-input d1"></textarea>
  </label>
 
  <label class="field">
    <span>Kuvaus<span style="display:inline-block; width:4cm;"></span>
 <label>
  <input type="checkbox" class="enable-checkbox" checked>
  Aktiivinen
    </label>	
	</span>
    <textarea maxlength="500" class="text-input d2"></textarea>
  </label>

  <div class="actions">
    <button class="save-btn">Save</button>
    <button class="cancel-btn">Cancel</button>
  </div>
</div>

<h2>Toinen lomake (päivittyy Save-napista)</h2>
<div id="other-form">
  <div><strong>Block 1:</strong> <span id="out1"></span></div>
  <div><strong>Block 2:</strong> <span id="out2"></span></div>
  <div><strong>Block 2 aktiivinen:</strong> <span id="out2active"></span></div>
</div>

<script src="grid-1.js">
</script>

</body>
</html>
